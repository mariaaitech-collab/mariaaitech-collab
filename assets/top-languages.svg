<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title">
<title id="title">Top Languages</title>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF2E97"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#00D4FF"/></linearGradient>
<clipPath id="bar"><rect x="25" y="58" width="0" height="12" rx="6"><animate attributeName="width" from="0" to="445" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/></rect></clipPath>
</defs>
<style>
.t{font:700 18px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:url(#g)}
.l{font:500 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#E6EDF3}
.p{font:600 13px 'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif;fill:#8B949E}
.lg{animation:in .5s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
<rect x="1" y="1" width="493" height="193" rx="12" fill="#0D1117" stroke="url(#g)" stroke-width="1.5"/>
<text x="25" y="38" class="t">Top Languages</text>
<rect x="25" y="58" width="445" height="12" rx="6" fill="#21262D"/>
<g clip-path="url(#bar)"><rect x="25.0" y="58" width="198.6" height="12" fill="#8B5CF6"/><rect x="223.1" y="58" width="93.8" height="12" fill="#FACC15"/><rect x="316.4" y="58" width="91.7" height="12" fill="#00D4FF"/><rect x="407.6" y="58" width="33.9" height="12" fill="#FF2E97"/><rect x="441.0" y="58" width="11.5" height="12" fill="#22C55E"/><rect x="452.0" y="58" width="11.5" height="12" fill="#FB923C"/><rect x="463.0" y="58" width="7.5" height="12" fill="#A3E635"/></g>
<g class="lg" style="animation-delay:0.40s"><circle cx="31" cy="98" r="6" fill="#8B5CF6"/><text x="45" y="102" class="l">PHP</text><text x="225" y="102" class="p" text-anchor="end">44.5%</text></g><g class="lg" style="animation-delay:0.55s"><circle cx="261" cy="98" r="6" fill="#FACC15"/><text x="275" y="102" class="l">JavaScript</text><text x="455" y="102" class="p" text-anchor="end">21.0%</text></g><g class="lg" style="animation-delay:0.70s"><circle cx="31" cy="122" r="6" fill="#00D4FF"/><text x="45" y="126" class="l">TypeScript</text><text x="225" y="126" class="p" text-anchor="end">20.5%</text></g><g class="lg" style="animation-delay:0.85s"><circle cx="261" cy="122" r="6" fill="#FF2E97"/><text x="275" y="126" class="l">Kotlin</text><text x="455" y="126" class="p" text-anchor="end">7.5%</text></g><g class="lg" style="animation-delay:1.00s"><circle cx="31" cy="146" r="6" fill="#22C55E"/><text x="45" y="150" class="l">Python</text><text x="225" y="150" class="p" text-anchor="end">2.5%</text></g><g class="lg" style="animation-delay:1.15s"><circle cx="261" cy="146" r="6" fill="#FB923C"/><text x="275" y="150" class="l">HTML</text><text x="455" y="150" class="p" text-anchor="end">2.5%</text></g><g class="lg" style="animation-delay:1.30s"><circle cx="31" cy="170" r="6" fill="#A3E635"/><text x="45" y="174" class="l">CSS</text><text x="225" y="174" class="p" text-anchor="end">1.6%</text></g>
</svg>
